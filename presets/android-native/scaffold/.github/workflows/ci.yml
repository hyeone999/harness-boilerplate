# /setup-harness가 {{...}} 자리를 프로젝트 값으로 채운다.
# 에뮬레이터 UI 검증은 로컬에서 한다. CI는 컴파일·린트·단위 테스트·디버그 빌드까지 맡는다.
name: CI

on:
  pull_request:
  push:
    branches: [{{BASE_BRANCH}}]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - run: {{TYPECHECK_CMD}}
      - run: {{LINT_CMD}}
      - run: {{TEST_CMD}}
      - run: ./gradlew assembleDebug
